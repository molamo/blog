<!doctype html>
<meta charset="utf-8">
<title>泰文字母記憶站 · 詞典</title>
<style>
:root{
  --bg:#faf9f7; --card:#fff; --ink:#1c1a17; --dim:#6b6560; --line:#e3ded7;
  --hi:#b45309; --mid:#0e7490; --lo:#7c3aed; --anchor:#c2410c; --warn:#b91c1c;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#161513; --card:#211f1c; --ink:#ece8e1; --dim:#9a938a; --line:#332f2a;
        --hi:#fbbf24; --mid:#22d3ee; --lo:#c4b5fd; --anchor:#fb923c; --warn:#f87171;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.6 "Noto Sans Thai","Leelawadee UI","Segoe UI",system-ui,sans-serif}
.thai{font-family:"Noto Serif Thai","Leelawadee UI","Tahoma",serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);
  border-bottom:1px solid var(--line);padding:18px 20px 12px}
.wrap{max-width:820px;margin:0 auto}
h1{margin:0 0 12px;font-size:15px;font-weight:600;letter-spacing:.04em;color:var(--dim)}
#q{width:100%;padding:14px 16px;font-size:22px;border:2px solid var(--line);
  border-radius:10px;background:var(--card);color:var(--ink)}
#q:focus{outline:none;border-color:var(--anchor)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{padding:4px 11px;font-size:13px;border:1px solid var(--line);border-radius:999px;
  background:transparent;color:var(--dim);cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#count{font-size:13px;color:var(--dim);margin-top:8px}
main{max-width:820px;margin:0 auto;padding:8px 20px 80px}
.word{background:var(--card);border:1px solid var(--line);border-radius:10px;
  margin:10px 0;overflow:hidden}
.head{display:flex;align-items:baseline;gap:12px;padding:14px 16px;cursor:pointer}
.head:hover{background:rgba(128,128,128,.06)}
.tw{font-size:30px;line-height:1.3}
.say-btn{flex:none;border:1px solid var(--line);background:var(--card);color:var(--dim);
  border-radius:7px;padding:3px 9px;font-size:15px;line-height:1.4;cursor:pointer;
  text-decoration:none;display:inline-block}
.say-btn:hover{border-color:var(--anchor);color:var(--anchor)}
.say-btn.saying{border-color:var(--anchor);color:var(--anchor);
  background:rgba(194,65,12,.12)}
.zh{font-size:16px}
.meta{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim)}
.tag{padding:2px 8px;border:1px solid var(--line);border-radius:4px}
.date{font:12px ui-monospace,monospace}
.sorts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;
  font-size:13px;color:var(--dim)}
/* 遮罩：中文與 🔊 留著，泰文糊掉 —— 用 blur 不用 display:none，
   位置與行高不動，才不會一開一關整頁跳。點一下就解開那一個詞。 */
.word.masked .thai{filter:blur(7px);user-select:none}
.word.masked .head::after{content:'點一下看答案';font-size:12px;color:var(--dim);
  border:1px dashed var(--line);border-radius:999px;padding:2px 8px;white-space:nowrap}
.star{color:var(--anchor)}
.body{display:none;padding:0 16px 16px;border-top:1px solid var(--line)}
.word.open .body{display:block}
.src{font-size:13px;color:var(--dim);margin:12px 0}
.syl{border:1px solid var(--line);border-radius:8px;padding:12px;margin:10px 0}
.syl-h{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.syl-h b{font-size:26px;font-weight:500}
.parts{display:flex;flex-wrap:wrap;gap:6px}
.part{font-size:13px;padding:3px 9px;border-radius:5px;background:rgba(128,128,128,.12)}
.part i{font-style:normal;color:var(--dim)}
.cell{margin-top:9px;font-size:14px;padding:7px 10px;border-radius:6px;
  background:rgba(128,128,128,.08);border-left:3px solid var(--line)}
.cls-中{color:var(--mid)} .cls-高{color:var(--hi)} .cls-低{color:var(--lo)}
.chars{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}
.ch{text-align:center;min-width:42px;padding:5px 4px;border:1px solid var(--line);
  border-radius:6px;font-size:12px;color:var(--dim)}
.ch b{display:block;font-size:22px;font-weight:500;color:var(--ink);line-height:1.4}
.ch.anchor{border-color:var(--anchor);border-width:2px}
.ch.anchor b{color:var(--anchor)}
.note{font-size:13px;color:var(--dim);margin-top:10px;font-style:italic}
.skip{font-size:13px;color:var(--dim);padding:10px 0}
.warn{color:var(--warn)}
kbd{font:12px ui-monospace,monospace;border:1px solid var(--line);border-radius:4px;padding:1px 5px}
</style>

<header><div class="wrap">
  <h1>泰文字母記憶站 · 詞典</h1>
  <input id="q" placeholder="搜尋泰文／中文／出處／字母…" autofocus autocomplete="off">
  <div class="chips" id="kinds"></div>
  <div class="sorts" id="sorts">排序</div>
  <div id="count"></div>
</div></header>
<main id="list"></main>

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const L = {}; D.子音.forEach(c => L[c.字母] = c);
const KINDS = ['對白','人名','地名','劇名'];
let kind = '', anchorOnly = false, masked = false;

// 排序。預設「最新加入」—— 加了詞就是要先複習它，那是這個站的日常動線。
// 同一天加的用檔案順序當第二鍵（後加的在檔案後面），所以同一天內也分得出先後。
const SORTS = [['最新加入', -1], ['最早加入', 1], ['原順序', 0]];
let sortDir = -1;
D.詞.forEach((w, i) => w._i = i);

const chips = document.getElementById('kinds');
[['全部','']].concat(KINDS.map(k => [k,k])).forEach(pair => {
  const b = document.createElement('button');
  b.className = 'chip'; b.textContent = pair[0];
  b.onclick = () => { kind = pair[1]; draw(); };
  b.dataset.kind = pair[1]; chips.appendChild(b);
});
const ab = document.createElement('button');
ab.className = 'chip'; ab.textContent = '★ 只看有錨點';
ab.onclick = () => { anchorOnly = !anchorOnly; draw(); };
chips.appendChild(ab);

// 遮罩：看中文＋聽發音，自己想泰文怎麼拼 —— 反過來考的那一面。
const mb = document.createElement('button');
mb.className = 'chip'; mb.textContent = '👁 遮住泰文';
mb.title = '只留中文與 🔊，泰文糊掉。點某一列就解開那一個';
mb.onclick = () => { masked = !masked; draw(); };
chips.appendChild(mb);

const sorts = document.getElementById('sorts');
SORTS.forEach(pair => {
  const b = document.createElement('button');
  b.className = 'chip'; b.textContent = pair[0];
  b.onclick = () => { sortDir = pair[1]; draw(); };
  b.dataset.sort = pair[1]; sorts.appendChild(b);
});

function sorted(rows){
  if (!sortDir) return rows;
  return rows.slice().sort((a, b) =>
    sortDir * ((a.加入日期 < b.加入日期 ? -1 : a.加入日期 > b.加入日期 ? 1 : 0) || a._i - b._i));
}

function hasAnchor(w){ return w.字元.some(c => c.錨點); }

function match(w, q){
  if (!q) return true;
  const hay = [w.泰文, w.中文, w.出處, w.備註, w.類型, w.加入日期].join(' ').toLowerCase();
  if (hay.indexOf(q) >= 0) return true;
  // 單獨打一個字母時，也要找得到「這個字母出現在哪些詞裡」
  return Array.from(q).every(ch => w.泰文.indexOf(ch) >= 0);
}

function syllableHTML(s){
  if (s.缺什麼.length)
    return '<div class="syl"><div class="syl-h"><b class="thai">' + s.音節 + '</b></div>' +
      '<div class="warn">算不出來：' + s.缺什麼.join('；') + '</div></div>';
  const p = [];
  if (s.前引) p.push('<span class="part"><i>前引</i> <span class="thai">' + s.前引 + '</span> 不發音</span>');
  // 承前＝前一個音節的帶音前引把這裡提去它那組（สวัสดี 的 วัส 因此算高子音）
  if (s.承前) p.push('<span class="part"><i>承前</i> <span class="thai">' + s.承前 +
    '</span> 提去 <b class="cls-' + s.分類 + '">' + s.分類 + '子音</b>組</span>');
  if (s.初聲) p.push('<span class="part"><i>初聲</i> <span class="thai">' + s.初聲 + '</span> /' + ((L[s.初聲]||{}).初聲音 || '') + '/</span>');
  if (s.母音式樣) p.push('<span class="part"><i>母音</i> <span class="thai">' + s.母音式樣 + '</span> ' + s.母音音 + ' ' + s.長短 + '</span>');
  if (s.尾音) p.push('<span class="part"><i>尾音</i> <span class="thai">' + s.尾音 + '</span> → /' + s.尾音音 + '/</span>');
  if (s.聲調符號) p.push('<span class="part"><i>聲調</i> <span class="thai">' + s.聲調符號 + '</span></span>');
  const mark = s.聲調符號 ? '<span class="thai">' + s.聲調符號 + '</span>' : '無符號';
  return '<div class="syl">' +
    '<div class="syl-h"><b class="thai">' + s.音節 + '</b></div>' +
    '<div class="parts">' + p.join('') + '</div>' +
    '<div class="cell">聲調格子　<b class="cls-' + s.分類 + '">' + s.分類 + '子音</b> · ' +
    s.死活 + '音 · ' + mark + '</div></div>';
}

function wordHTML(w){
  const star = hasAnchor(w) ? '<span class="star">★</span>' : '';
  const chars = w.字元.filter(c => c.序 > 0).map(c =>
    '<div class="ch' + (c.錨點 ? ' anchor' : '') + '"><b class="thai">' + c.字元 + '</b>' + c.角色 + '</div>').join('');
  const hidden = w.字元.filter(c => c.序 < 0).map(c =>
    '<div class="ch"><b class="thai">' + c.字元 + '</b>隱藏母音</div>').join('');
  let inner;
  if (w.略) inner = '<div class="skip">這個詞標了「略」—— 為了記詞而加，沒有逐字角色。</div>';
  else if (!w.標完) inner = '<div class="skip warn">還沒標完，算不出音節分析。</div>';
  else inner = w.音節.map(syllableHTML).join('');
  return '<article class="word' + (masked ? ' masked' : '') + '">' +
    '<div class="head">' +
      '<span class="tw thai">' + w.泰文 + '</span>' +
      sayButton(w.泰文, masked ? '聽這個詞' : null) +
      '<span class="zh">' + w.中文 + '</span>' +
      '<span class="meta">' + star + '<span class="date">' + (w.加入日期 || '') + '</span>' +
        '<span class="tag">' + w.類型 + '</span></span>' +
    '</div>' +
    '<div class="body">' +
      '<div class="src">出處　' + (w.出處 || '—') + '</div>' +
      inner +
      '<div class="chars">' + chars + hidden + '</div>' +
      (w.備註 ? '<div class="note">' + w.備註 + '</div>' : '') +
    '</div></article>';
}

function draw(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  const rows = sorted(D.詞.filter(w => match(w, q))
    .filter(w => !kind || w.類型 === kind)
    .filter(w => !anchorOnly || hasAnchor(w)));
  document.getElementById('list').innerHTML =
    rows.map(wordHTML).join('') ||
    '<p style="color:var(--dim);padding:30px 0">沒有符合的詞。</p>';
  document.getElementById('count').innerHTML =
    rows.length + ' / ' + D.詞.length + ' 個詞　·　' +
    (masked ? '遮罩中：點一行掀答案，再點一下才展開' : '點一行展開音節分析') +
    '　·　<kbd>/</kbd> 回到搜尋框' +
    '　·　' + sayStatus();
  Array.from(chips.querySelectorAll('[data-kind]')).forEach(b =>
    b.setAttribute('aria-pressed', b.dataset.kind === kind));
  ab.setAttribute('aria-pressed', anchorOnly);
  mb.setAttribute('aria-pressed', masked);
  Array.from(sorts.querySelectorAll('[data-sort]')).forEach(b =>
    b.setAttribute('aria-pressed', Number(b.dataset.sort) === sortDir));
  Array.from(document.querySelectorAll('.head')).forEach(h =>
    h.onclick = e => {
      if (e.target.closest('.say-btn')) return;   // 按喇叭不要順便展開整列
      const w = h.parentElement;
      if (w.classList.contains('masked')){        // 遮著時第一下是掀答案
        w.classList.remove('masked');
        return;
      }
      w.classList.toggle('open');
    });
}

/* 朗讀。兩個樣板共用，由 build.py 注入到 /*__SAY__*​/ 的位置。

   CLAUDE.md 的規矩是「不能因為某台機器沒裝泰文語音就整站靜音」，所以是兩層：
     1. getVoices() 找得到 th 開頭的語音 -> 站內唸（Edge 的線上泰文語音不必裝語言套件）
     2. 找不到 -> 不攔截，讓 <a href> 把外部 TTS 網站開起來
   href 一直都在、不是靠 JS 生的，所以退路是靜態的。 */

let voices = [];
function loadVoices(){
  try { voices = window.speechSynthesis ? speechSynthesis.getVoices() : []; }
  catch (e) { voices = []; }
}
loadVoices();
// getVoices() 第一次常常回空陣列，要等 voiceschanged 才有東西
if (window.speechSynthesis) speechSynthesis.addEventListener('voiceschanged', loadVoices);

function thaiVoice(){
  return voices.filter(v => (v.lang || '').toLowerCase().indexOf('th') === 0)[0];
}

/* 母音式樣要拿 อ 當載體才唸得出來：เ-อ -> เออ、-า -> อา。
   泰文本來就是這樣唸孤立母音的，破折號不是字元。 */
function sayable(pattern){
  return pattern.split('-').join('อ');
}

function sayHref(text){
  return D.發音連結.replace('{}', encodeURIComponent(text));
}

function sayButton(text, title){
  return '<a class="say-btn" target="_blank" rel="noopener" data-say="' + text +
    '" title="' + (title || ('聽 ' + text)) + '" href="' + sayHref(text) + '">🔊</a>';
}

/* 語速。只有五聲對照那一塊用得到 —— 那裡是刻意在比較音高曲線，放慢或加快
   都可能幫上忙。查單字時不需要，唸一遍就是一遍，多一個下拉只是雜訊。
   放慢會把曲線拉平（โท 的「摔下來」、จัตวา 的「先沉後升」最先被抹掉），
   所以預設 1。 */
let sayRate = 1;
const SAY_RATES = [['0.6', '很慢'], ['0.8', '慢'], ['1', '正常'], ['1.2', '快']];

function sayRateControl(){
  return '<select class="say-rate" title="合成語音的語速。放慢會讓聲調變平，分不出來就調回正常">' +
    SAY_RATES.map(r => '<option value="' + r[0] + '"' +
      (Number(r[0]) === sayRate ? ' selected' : '') + '>' + r[1] + ' ×' + r[0] +
      '</option>').join('') + '</select>';
}

document.addEventListener('change', e => {
  if (e.target.classList && e.target.classList.contains('say-rate')) {
    sayRate = Number(e.target.value);
  }
});

function sayStatus(){
  const v = thaiVoice();
  return v ? '🔊 站內朗讀（' + v.name + '）' : '🔊 這台沒有泰文語音，會開 TTS 網站';
}

document.addEventListener('click', e => {
  const btn = e.target.closest('.say-btn');
  if (!btn) return;
  const voice = thaiVoice();
  if (!voice) return;                 // 沒泰文語音 -> 不攔，讓連結開外站
  e.preventDefault();
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(btn.dataset.say);
  u.voice = voice;
  u.lang = voice.lang;
  u.rate = sayRate;
  btn.classList.add('saying');
  u.onend = u.onerror = () => btn.classList.remove('saying');
  speechSynthesis.speak(u);
});

document.getElementById('q').oninput = draw;
document.addEventListener('keydown', e => {
  if (e.key === '/' && e.target.id !== 'q'){ e.preventDefault(); document.getElementById('q').focus(); }
});
draw();
</script>
